<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GothBreachAI — Управление</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        .app { max-width: 480px; margin: 0 auto; padding: 16px; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; margin-bottom: 16px; }
        .header h1 { font-size: 24px; background: linear-gradient(135deg, #ff006e, #8338ec); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
        .tab { padding: 8px 16px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .tab.active { background: #8338ec; border-color: #8338ec; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #1a1a1a; border-radius: 16px; padding: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .card:hover, .card.selected { border-color: #8338ec; }
        .card-img { width: 100%; aspect-ratio: 2/3; border-radius: 12px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 8px; }
        .card-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .card-desc { font-size: 11px; color: #999; line-height: 1.3; }
        .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; }
        .btn-primary { background: linear-gradient(135deg, #ff006e, #8338ec); color: #fff; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Шапка -->
        <div class="header"><h1>🔮 GothBreachAI</h1></div>

        <!-- Вкладки -->
        <div class="tabs" id="tabs">
            <div class="tab active" data-page="characters">👩‍🦰 Девушки</div>
            <div class="tab" data-page="album">🖼️ Альбом</div>
            <div class="tab" data-page="stats">📊 Статистика</div>
            <div class="tab" data-page="shop">🛒 Магазин</div>
            <div class="tab" data-page="settings">⚙️</div>
        </div>

        <!-- Страницы -->
        <div class="page active" id="page-characters"></div>
        <div class="page" id="page-album"><p style="color:#666;text-align:center;padding:40px;">📭 Альбом пуст</p></div>
        <div class="page" id="page-stats"><p style="color:#666;text-align:center;padding:40px;">📊 Нет данных</p></div>
        <div class="page" id="page-shop"><p style="color:#666;text-align:center;padding:40px;">🛒 Скоро открытие</p></div>
        <div class="page" id="page-settings"><p style="color:#666;text-align:center;padding:40px;">⚙️ Настройки</p></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Данные персонажей (зеркало из бота)
        const PARTNERS = {
            kira: { emoji: "🖤", name: "Кира", desc: "Панк-рокерша, 24 года. Дерзкая, татуированная.", img: "🖤" },
            alisa: { emoji: "🎀", name: "Алиса", desc: "Студентка, 19 лет. Рыжая, застенчивая.", img: "🎀" },
            valeria: { emoji: "💋", name: "Валерия", desc: "Бизнес-леди, 38 лет. Опытная милфа.", img: "💋" },
            dasha: { emoji: "💉", name: "Даша", desc: "Медсестра, 25 лет. Профессиональная.", img: "💉" },
            margo: { emoji: "⛓️", name: "Марго", desc: "Доминатрикс, 30 лет. Властная.", img: "⛓️" },
            zara: { emoji: "🔥", name: "Зара", desc: "Танцовщица, 27 лет. Страстная бразильянка.", img: "🔥" },
            katya: { emoji: "🎮", name: "Катя", desc: "Стримерша, 21 год. Дерзкая и энергичная.", img: "🎮" },
            lolita: { emoji: "💎", name: "Лолита", desc: "Порно-звезда, 29 лет. Знает всё.", img: "💎" },
            diana: { emoji: "🦋", name: "Диана", desc: "Искусительница, 19 лет. Роковая.", img: "🦋" }
        };

        let selectedPartner = null;

        // Рендер карточек персонажей
        function renderCharacters() {
            const page = document.getElementById('page-characters');
            let html = '<div class="cards">';
            for (const [key, p] of Object.entries(PARTNERS)) {
                html += `
                    <div class="card ${selectedPartner === key ? 'selected' : ''}" onclick="selectPartner('${key}')">
                        <div class="card-img">${p.img}</div>
                        <div class="card-name">${p.emoji} ${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                    </div>`;
            }
            html += '</div>';
            if (selectedPartner) {
                html += `<button class="btn btn-primary" onclick="startScene()">🔥 Начать сцену с ${PARTNERS[selectedPartner].name}</button>`;
            }
            page.innerHTML = html;
        }

        function selectPartner(key) {
            selectedPartner = key;
            renderCharacters();
        }

        function startScene() {
            if (!selectedPartner) return;
            tg.sendData(JSON.stringify({ action: "start_scene", partner: selectedPartner }));
            tg.close();
        }

        // Переключение вкладок
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('page-' + tab.dataset.page).classList.add('active');
            });
        });

        renderCharacters();
    </script>
</body>
</html>
